<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maromba Run - Foco no Shape</title>
    <style>
        /* Estilização Básica */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222; /* Fundo escuro de academia */
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 {
            margin-top: -50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Área do Jogo */
        #game-container {
            width: 800px;
            height: 300px;
            border-bottom: 5px solid #555;
            position: relative;
            background: linear-gradient(to bottom, #333, #222);
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* O Marombeiro */
        #maromba {
            width: 60px;
            height: 80px;
            position: absolute;
            bottom: 0;
            left: 50px;
            /* Usando emoji como sprite provisório */
            font-size: 60px; 
            line-height: 80px;
            text-align: center;
        }

        /* Classe de animação de pulo */
        .jump-animation {
            animation: jump 0.6s ease-out;
        }

        @keyframes jump {
            0% { bottom: 0; }
            30% { bottom: 120px; } /* Altura do pulo */
            60% { bottom: 120px; }
            100% { bottom: 0; }
        }

        /* O Obstáculo (Pizza/Hambúrguer) */
        #obstacle {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 0;
            right: -50px; /* Começa fora da tela */
            font-size: 35px;
            line-height: 40px;
            text-align: center;
        }

        /* Animação do obstáculo se movendo */
        .obstacle-animation {
            animation: moveObstacle 2s infinite linear;
        }

        @keyframes moveObstacle {
            0% { right: -50px; }
            100% { right: 100%; }
        }

        /* Placar */
        #score {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Botão de Iniciar */
        #start-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
        }

        .btn {
            background-color: #00ffcc;
            color: #222;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            border-radius: 5px;
        }
        
        .btn:hover {
            background-color: #00ccaa;
        }

    </style>
</head>
<body>

    <h1>Maromba Run 🏋️‍♂️</h1>
    
    <div id="game-container">
        <div id="score">Whey: 0</div>
        <div id="start-msg">
            <p>Fuja das calorias vazias!</p>
            <p>Pressione ESPAÇO para pular</p>
            <button class="btn" onclick="startGame()">BORIBILDER!</button>
        </div>

        <div id="maromba">🏋️</div>
        
        <div id="obstacle">🍕</div>
    </div>

    <script>
        const maromba = document.getElementById('maromba');
        const obstacle = document.getElementById('obstacle');
        const scoreElement = document.getElementById('score');
        const startMsg = document.getElementById('start-msg');
        
        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameLoop; // Para controlar a verificação de colisão
        let scoreInterval; // Para controlar os pontos

        // Lista de obstáculos (Tentações)
        const foods = ['🍕', '🍔', '🍩', '🌭', '🍺', '🍟'];

        function startGame() {
            startMsg.style.display = 'none';
            isGameOver = false;
            score = 0;
            scoreElement.innerText = "Whey: 0";
            
            obstacle.classList.add('obstacle-animation');
            
            // Reinicia animação para garantir velocidade inicial
            obstacle.style.animation = 'none';
            obstacle.offsetHeight; /* trigger reflow */
            obstacle.style.animation = 'moveObstacle 1.8s infinite linear';

            // Inicia loop de pontos
            scoreInterval = setInterval(() => {
                score++;
                scoreElement.innerText = "Whey: " + score;
                
                // Aumenta a dificuldade (velocidade) a cada 100 pontos
                if (score % 100 === 0) {
                    increaseSpeed();
                }
            }, 100);

            // Inicia verificação de colisão
            gameLoop = setInterval(checkCollision, 10);
        }

        function increaseSpeed() {
            const currentDuration = parseFloat(getComputedStyle(obstacle).animationDuration);
            if (currentDuration > 0.8) { // Limite máximo de velocidade
                const newDuration = (currentDuration - 0.1) + 's';
                obstacle.style.animationDuration = newDuration;
            }
        }

        function jump() {
            if (!isJumping && !isGameOver) {
                isJumping = true;
                maromba.classList.add('jump-animation');

                setTimeout(() => {
                    maromba.classList.remove('jump-animation');
                    isJumping = false;
                }, 600); // Duração da animação CSS
            }
        }

        function checkCollision() {
            // Posição vertical do maromba (topo)
            let marombaTop = parseInt(window.getComputedStyle(maromba).getPropertyValue("top"));
            
            // Posição horizontal do obstáculo
            let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));

            // Detecta colisão
            // O obstáculo está entre 0 e 50px (perto do maromba) E o maromba não pulou alto o suficiente
            // Altura total do container é 300. Personagem tem 80px. Bottom 0 = Top 220.
            // Se ele pular, o Top diminui. Se Top > 240 (chutando margem), ele tá no chão.
            
            // Ajuste fino da colisão
            if (obstacleLeft < 100 && obstacleLeft > 50 && marombaTop >= 220) {
                gameOver();
            }
            
            // Troca o ícone da comida aleatoriamente quando sai da tela
            if (obstacleLeft < 0) {
                changeFood();
            }
        }

        function changeFood() {
            // Só troca visualmente, a lógica de colisão é a mesma
            // Mas precisamos garantir que isso rode apenas uma vez por ciclo do obstáculo
            // O CSS cuida do loop, aqui é só um visual extra se quiser
            const randomFood = foods[Math.floor(Math.random() * foods.length)];
            obstacle.innerText = randomFood;
        }

        function gameOver() {
            isGameOver = true;
            obstacle.classList.remove('obstacle-animation');
            clearInterval(gameLoop);
            clearInterval(scoreInterval);
            
            startMsg.innerHTML = `
                <p style="color: red; font-weight: bold;">COMEU BESTEIRA!</p>
                <p>Score Final: ${score}</p>
                <button class="btn" onclick="startGame()">TREINAR DE NOVO</button>
            `;
            startMsg.style.display = 'block';
        }

        // Controles
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.code === 'ArrowUp') {
                jump();
            }
        });

        // Para celular
        document.addEventListener('touchstart', () => {
            jump();
        });

    </script>
</body>
</html>
